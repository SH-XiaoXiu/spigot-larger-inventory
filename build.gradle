plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.5"
}

group = 'cn.xiuxius.mc'

// 获取开发版本: commit短hash + 时间戳
static def getDevVersion() {
    try {
        def commit = 'git rev-parse --short HEAD'.execute().text.trim()
        def timestamp = new Date().format('yyyyMMdd-HHmm')
        return "${commit}-${timestamp}"
    } catch (Exception e) {
        return 'dev-SNAPSHOT'
    }
}

// 获取发布版本: tag-hash (如果没有tag则用 commit)
static def getReleaseVersion() {
    try {
        // 获取最近的tag（不含commit后缀）
        def tag = 'git describe --tags --abbrev=0'.execute().text.trim()
        def commit = 'git rev-parse --short HEAD'.execute().text.trim()
        return "${tag}-${commit}"
    } catch (Exception ignored) {
        // 没有tag时，只用commit
        def commit = 'git rev-parse --short HEAD'.execute().text.trim()
        return "untagged-${commit}"
    }
}

// 判断是否执行 release task
def isRelease = gradle.startParameter.taskNames.contains('release')

// 根据构建类型选择版本
version = isRelease ? getReleaseVersion() : getDevVersion()

println "Building version: ${version} (${isRelease ? 'release' : 'dev'})"

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("me.clip:placeholderapi:2.11.6")
    implementation("com.zaxxer:HikariCP:5.1.0")
    implementation("org.slf4j:slf4j-jdk14:2.0.9")
}

shadowJar {
    relocate 'com.zaxxer.hikari', 'cn.xiuxius.mc.largerinventory.lib.hikari'
    relocate 'org.slf4j', 'cn.xiuxius.mc.largerinventory.lib.slf4j'
}

tasks {
    build {
        dependsOn shadowJar
    }
    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

// Release task: 构建发布版本
tasks.register('release') {
    group = 'build'
    description = 'Build with release version (tag-commit)'

    dependsOn shadowJar
}
